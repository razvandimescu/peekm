name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  goreleaser:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Chained here rather than a release: published workflow because goreleaser creates the
  # release with GITHUB_TOKEN, and GITHUB_TOKEN-triggered events don't start new workflow runs.
  fractal:
    needs: goreleaser
    permissions:
      contents: write
    uses: razvandimescu/fractal-of-the-day/.github/workflows/release-fractal.reusable.yml@main
    with:
      tag: ${{ github.ref_name }}

  # Redeploys peekm.dev so latest.json names the new release. workflow_dispatch is exempt
  # from the GITHUB_TOKEN rule above, and the github-pages environment accepts only main.
  pages:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # npm >= 11.5.1 for trusted publishing
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "v${VERSION}" -D dist -p "*.tar.gz" -p "*.zip"

          cd dist
          for file in *.tar.gz; do
            dir=$(echo "$file" | sed "s/peekm_${VERSION}_/peekm_/" | sed 's/\.tar\.gz//')
            mkdir -p "$dir"
            tar xzf "$file" -C "$dir"
          done
          for file in *.zip; do
            dir=$(echo "$file" | sed "s/peekm_${VERSION}_/peekm_/" | sed 's/\.zip//')
            mkdir -p "$dir"
            unzip -q "$file" -d "$dir"
          done

      - name: Publish to npm
        env:
          # Fallback until the first OIDC publish succeeds; then delete the secret and this line.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/publish-npm.sh "$VERSION"
