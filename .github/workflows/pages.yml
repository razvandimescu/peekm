name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, assets/hero.png, theme/fonts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make site
      # peekm's update check reads this file.
      - run: |
          gh release view --json tagName --jq '.tagName | ltrimstr("v") | {version: .}' > site/latest.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
