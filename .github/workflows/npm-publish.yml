name: Publish to npm (manual retry)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          # Support both release event (tag name) and manual dispatch (input)
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          gh release download "v${VERSION}" -D dist -p "*.tar.gz" -p "*.zip"

          # Extract each archive into a subdirectory matching publish-npm.sh expectations
          # e.g. peekm_0.1.5_darwin_arm64.tar.gz → dist/peekm_darwin_arm64/peekm
          cd dist
          for file in *.tar.gz; do
            dir=$(echo "$file" | sed "s/peekm_${VERSION}_/peekm_/" | sed 's/\.tar\.gz//')
            mkdir -p "$dir"
            tar xzf "$file" -C "$dir"
          done
          for file in *.zip; do
            dir=$(echo "$file" | sed "s/peekm_${VERSION}_/peekm_/" | sed 's/\.zip//')
            mkdir -p "$dir"
            unzip -q "$file" -d "$dir"
          done

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          ./scripts/publish-npm.sh "$VERSION"
