<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peekm - AI Timeline</title>
    <style>
        {{.GitHubCSS}}
        {{.ThemeOverrides}}
        {{.StandaloneCSS}}

        .repo-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8em;
            color: var(--fgColor-muted);
            margin-bottom: 20px;
        }
        .repo-info-name {
            font-weight: 600;
            color: var(--fgColor-default);
        }
        .repo-info-branch {
            background: var(--bgColor-accent-muted, rgba(56, 139, 253, 0.1));
            color: var(--fgColor-accent, #388bfd);
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 0.9em;
        }
        .repo-info-remote {
            color: var(--fgColor-muted);
            font-size: 0.9em;
        }
        .repo-info-remote::before {
            content: "·";
            margin-right: 8px;
        }

        .session-filter-banner {
            background: var(--bgColor-muted);
            border: 1px solid var(--borderColor-default);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .session-filter-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.85em;
        }
        .session-filter-stats code {
            font-size: 0.85em;
            background: var(--bgColor-default);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .session-filter-stat {
            color: var(--fgColor-muted);
        }
        .session-filter-stat::before {
            content: "·";
            margin-right: 12px;
            color: var(--borderColor-default);
        }
        .session-filter-clear,
        a.session-filter-transcript {
            font-size: 0.85em;
            color: var(--fgColor-accent);
            text-decoration: none;
            white-space: nowrap;
        }
        .session-filter-clear:hover { text-decoration: underline; }
        a.session-filter-transcript {
            background: var(--bgColor-accent-muted, rgba(56, 139, 253, 0.1));
            padding: 4px 12px;
            border-radius: 16px;
            font-weight: 500;
        }
        a.session-filter-transcript:hover {
            background: var(--bgColor-accent-emphasis, #388bfd);
            color: #fff;
        }

        .timeline-file-path {
            color: var(--fgColor-default);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-size: 0.9em;
        }
        .timeline-copy-btn {
            background: none;
            border: 1px solid var(--borderColor-default);
            border-radius: 4px;
            padding: 2px 5px;
            margin-left: 6px;
            cursor: pointer;
            color: var(--fgColor-muted);
            vertical-align: middle;
            line-height: 1;
        }
        .timeline-copy-btn:hover {
            color: var(--fgColor-accent);
            border-color: var(--fgColor-accent);
        }
        .timeline-copy-btn.copied {
            color: var(--fgColor-success, #2da44e);
            border-color: var(--fgColor-success, #2da44e);
        }
        .timeline-copy-btn:focus-visible {
            outline: 2px solid var(--fgColor-accent);
            outline-offset: 2px;
        }

        a.timeline-sid {
            text-decoration: none;
            color: inherit;
        }
        a.timeline-sid:hover {
            text-decoration: underline;
            color: var(--fgColor-accent);
        }
        a.timeline-transcript-link {
            text-decoration: none;
            color: var(--fgColor-muted);
            font-size: 0.85em;
            opacity: 0.8;
            padding: 1px 6px;
            border: 1px solid transparent;
            border-radius: 8px;
            transition: all 0.15s;
        }
        a.timeline-transcript-link:hover {
            opacity: 1;
            color: var(--fgColor-accent);
            border-color: var(--borderColor-default);
        }
    </style>
</head>
<body class="markdown-body">
    <header class="top-bar" role="banner">
        <div class="top-bar-left">
            <a href="/" style="text-decoration: none; color: var(--fgColor-default); font-weight: 600;">peekm</a>
        </div>
    </header>

    <div class="layout-container">
        {{template "content" .}}
    </div>

    <script>
        {{.ThemeManagerJS}}
        {{.NavigationJS}}
    </script>
</body>
</html>
