<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peekm - Transcript</title>
    <style>
        {{.GitHubCSS}}
        {{.ThemeOverrides}}
        {{.StandaloneCSS}}

        .subtitle { margin-bottom: 1em; }
        .transcript-header { margin-bottom: 24px; }

        .transcript-nav {
            display: flex;
            gap: 16px;
            font-size: 0.85em;
        }
        .transcript-nav a {
            color: var(--fgColor-accent);
            text-decoration: none;
        }
        .transcript-nav a:hover { text-decoration: underline; }

        .transcript-conversation {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .transcript-turn {
            padding: 20px 24px;
            border-left: 3px solid transparent;
        }

        .transcript-user {
            background: var(--bgColor-muted);
            border-left-color: var(--fgColor-accent);
        }

        .transcript-assistant {
            background: var(--bgColor-default);
            border-left-color: var(--fgColor-success, #2da44e);
        }

        .transcript-turn-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .transcript-role-badge {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .transcript-role-user {
            background: var(--bgColor-accent-muted, rgba(56, 139, 253, 0.1));
            color: var(--fgColor-accent);
        }
        .transcript-role-assistant {
            background: rgba(45, 164, 78, 0.1);
            color: var(--fgColor-success, #2da44e);
        }
        .transcript-model {
            font-size: 0.75em;
            color: var(--fgColor-muted);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        }

        .transcript-turn-body { font-size: 0.95em; }

        .transcript-text {
            line-height: 1.7;
        }
        .transcript-text p:first-child { margin-top: 0; }
        .transcript-text p:last-child { margin-bottom: 0; }

        /* Override markdown-body code blocks within transcript */
        .transcript-text pre {
            background: var(--bgColor-default);
            border: 1px solid var(--borderColor-default);
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
            font-size: 0.85em;
        }
        .transcript-user .transcript-text pre {
            background: var(--bgColor-default);
        }

        .transcript-thinking {
            margin: 8px 0;
            border: 1px solid var(--borderColor-default);
            border-radius: 6px;
            font-size: 0.85em;
        }
        .transcript-thinking summary {
            padding: 8px 12px;
            cursor: pointer;
            color: var(--fgColor-muted);
            font-style: italic;
            user-select: none;
        }
        .transcript-thinking summary:hover { color: var(--fgColor-default); }
        .transcript-thinking-content {
            padding: 12px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9em;
            color: var(--fgColor-muted);
            border-top: 1px solid var(--borderColor-default);
            max-height: 400px;
            overflow-y: auto;
        }

        .transcript-tool {
            margin: 8px 0;
            border: 1px solid var(--borderColor-default);
            border-radius: 6px;
            font-size: 0.85em;
        }
        .transcript-tool summary {
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .transcript-tool summary:hover { background: var(--bgColor-muted); border-radius: 6px 6px 0 0; }
        .transcript-tool-name {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-weight: 600;
            color: var(--fgColor-accent);
        }
        .transcript-tool-input {
            padding: 12px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9em;
            border-top: 1px solid var(--borderColor-default);
            max-height: 400px;
            overflow-y: auto;
            background: var(--bgColor-muted);
        }

        .transcript-context-summary {
            padding: 8px 12px;
            background: var(--bgColor-muted);
            border: 1px solid var(--borderColor-default);
            border-radius: 6px;
            color: var(--fgColor-muted);
            font-style: italic;
            font-size: 0.85em;
        }

        .transcript-empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--fgColor-muted);
        }
        .transcript-empty svg {
            margin-bottom: 16px;
            opacity: 0.4;
        }
    </style>
</head>
<body class="markdown-body">
    <header class="top-bar" role="banner">
        <div class="top-bar-left">
            <a href="/" style="text-decoration: none; color: var(--fgColor-default); font-weight: 600;">peekm</a>
        </div>
    </header>

    <div class="layout-container">
        {{template "content" .}}
    </div>

    <script>
        {{.ThemeManagerJS}}
        {{.NavigationJS}}
    </script>
</body>
</html>
