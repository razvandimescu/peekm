    <script>
        {{.ThemeManagerJS}}

        // Helper functions needed by navigation.js and inline code

        // Sidebar resize functionality
        (function() {
            const SIDEBAR_MIN_WIDTH = 200;
            const SIDEBAR_MAX_WIDTH = 600;
            const SIDEBAR_WIDTH_KEY = 'peekm-sidebar-width';

            const sidebar = document.querySelector('.file-sidebar');
            const resizeHandle = document.getElementById('sidebar-resize-handle');

            // Restore saved width
            const savedWidth = localStorage.getItem(SIDEBAR_WIDTH_KEY);
            if (savedWidth) {
                const width = parseInt(savedWidth, 10);
                if (width >= SIDEBAR_MIN_WIDTH && width <= SIDEBAR_MAX_WIDTH) {
                    sidebar.style.width = width + 'px';
                }
            }

            let isResizing = false;
            let startX = 0;
            let startWidth = 0;

            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;

                resizeHandle.classList.add('resizing');
                document.body.classList.add('sidebar-resizing');

                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;

                const delta = e.clientX - startX;
                let newWidth = startWidth + delta;

                // Constrain width
                newWidth = Math.max(SIDEBAR_MIN_WIDTH, Math.min(SIDEBAR_MAX_WIDTH, newWidth));

                sidebar.style.width = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (!isResizing) return;

                isResizing = false;
                resizeHandle.classList.remove('resizing');
                document.body.classList.remove('sidebar-resizing');

                // Save width to localStorage
                localStorage.setItem(SIDEBAR_WIDTH_KEY, sidebar.offsetWidth);
            });
        })();

        // Error toast (inline replacement for alert())
        let errorToastTimeout;
        function showErrorToast(message) {
            const toast = document.getElementById('error-toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('show');
            if (errorToastTimeout) clearTimeout(errorToastTimeout);
            errorToastTimeout = setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // Navigation modal functionality
        function openNavModal() {
            const modal = document.getElementById('nav-modal');
            const input = document.getElementById('nav-path');
            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }

        function closeNavModal(event) {
            if (event && event.target !== event.currentTarget) return;
            const modal = document.getElementById('nav-modal');
            modal.classList.remove('active');
        }

        function submitNavigation() {
            const input = document.getElementById('nav-path');
            const path = input.value.trim();

            if (!path) {
                showErrorToast('Please enter a directory path');
                return;
            }

            // Submit to backend
            fetch('/navigate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ path: path })
            })
            .then(response => {
                if (response.ok) {
                    // Close modal first
                    const modal = document.getElementById('nav-modal');
                    modal.classList.remove('active');

                    // Navigate to root using SPA if available
                    if (typeof navigate === 'function') {
                        navigate('/');
                    } else {
                        window.location.reload();
                    }
                } else {
                    return response.text().then(text => {
                        throw new Error(text || 'Navigation failed');
                    });
                }
            })
            .catch(error => {
                showErrorToast('Navigation error: ' + error.message);
            });
        }

        function startNewFolder(parentPath) {
            if (document.getElementById('new-folder-input')) return;
            parentPath = parentPath || '';

            const container = document.createElement('div');
            container.className = 'tree-item new-folder-input-container';
            container.dataset.parent = parentPath;
            container.innerHTML = '<div class="tree-node">' +
                '<span class="expand-icon">&#9654;</span>' +
                '<input type="text" id="new-folder-input" class="new-folder-input" ' +
                'placeholder="folder name" autocomplete="off" spellcheck="false">' +
                '</div>';

            if (parentPath) {
                // Find the folder's tree-children container and insert there
                var dirSpan = document.querySelector('.tree-directory[data-path="' + CSS.escape(parentPath) + '"]');
                if (dirSpan) {
                    var treeItem = dirSpan.closest('.tree-item');
                    var children = treeItem.querySelector('.tree-children');
                    // Auto-expand if collapsed
                    if (children && children.style.display === 'none') {
                        toggleDir(dirSpan);
                    }
                    if (children) {
                        children.prepend(container);
                    } else {
                        // No children container yet — create one
                        children = document.createElement('div');
                        children.className = 'tree-children';
                        children.appendChild(container);
                        treeItem.appendChild(children);
                    }
                } else {
                    // Fallback to root
                    parentPath = '';
                    container.dataset.parent = '';
                    var tree = document.querySelector('.sidebar-tree');
                    if (!tree) return;
                    tree.prepend(container);
                }
            } else {
                var tree = document.querySelector('.sidebar-tree');
                if (!tree) return;
                var separator = tree.querySelector('.smart-folders-separator');
                if (separator) {
                    separator.after(container);
                } else {
                    tree.prepend(container);
                }
            }

            var input = container.querySelector('input');
            input.focus();

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    createFolder(input.value.trim(), container.dataset.parent);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    container.remove();
                }
            });
            input.addEventListener('blur', function() {
                setTimeout(function() { container.remove(); }, 150);
            });
        }

        function createFolder(name, parentPath) {
            var container = document.querySelector('.new-folder-input-container');
            if (container) container.remove();
            if (!name) return;

            fetch('/folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, parent: parentPath || '' })
            })
            .then(function(response) {
                if (response.ok) {
                    var displayPath = parentPath ? parentPath + '/' + name : name;
                    showToast('Created folder: ' + displayPath, null, null);
                    scheduleTreeRefresh();
                } else {
                    return response.text().then(function(text) { throw new Error(text); });
                }
            })
            .catch(function(error) {
                showErrorToast(error.message);
            });
        }

        // Delete file confirmation and handling
        function confirmDelete() {
            const filePath = document.querySelector('.subtitle').textContent;
            const fileName = document.querySelector('h1').textContent;
            const modal = document.getElementById('delete-confirm-modal');
            const msg = document.getElementById('delete-confirm-message');
            if (!modal || !msg) return;

            msg.textContent = `Are you sure you want to delete "${fileName}"? The file will be moved to your system trash.`;
            modal.dataset.path = filePath;
            modal.classList.add('active');
        }

        function closeDeleteModal(event) {
            if (event && event.target && event.target !== event.currentTarget) return;
            const modal = document.getElementById('delete-confirm-modal');
            if (modal) {
                modal.classList.remove('active');
                delete modal.dataset.path;
            }
        }

        function executeDelete() {
            const modal = document.getElementById('delete-confirm-modal');
            if (modal && modal.dataset.path) deleteFile(modal.dataset.path);
        }

        function deleteFile(filePath) {
            closeDeleteModal();

            fetch('/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ path: filePath })
            })
            .then(response => {
                if (response.ok) {
                    const fileName = filePath.split('/').pop();
                    showToast('Moved to trash: ' + fileName, null, null);
                    if (typeof navigate === 'function') {
                        navigate('/');
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    return response.text().then(text => {
                        throw new Error(text || 'Delete failed');
                    });
                }
            })
            .catch(error => {
                console.error('[Delete] Error:', error);
                showErrorToast('Delete error: ' + error.message);
            });
        }

        // Escape key closes active modals and inputs
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const folderInput = document.getElementById('new-folder-input');
                if (folderInput) {
                    folderInput.closest('.new-folder-input-container').remove();
                    return;
                }
                const deleteModal = document.getElementById('delete-confirm-modal');
                if (deleteModal && deleteModal.classList.contains('active')) {
                    closeDeleteModal();
                    return;
                }
                const navModal = document.getElementById('nav-modal');
                if (navModal && navModal.classList.contains('active')) {
                    closeNavModal();
                    return;
                }
            }
        });

        // Handle Enter key in navigation input
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('nav-path');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        submitNavigation();
                    }
                });
            }
        });

        // Directory collapse/expand functionality
        // Note: Tree state persistence functions (getTreeState, saveTreeState, restoreTreeState)
        // are now defined in navigation.js for unified state management
        function toggleDir(dirElement) {
            const treeItem = dirElement.closest('.tree-item');
            const childrenContainer = treeItem.querySelector('.tree-children');
            const icon = dirElement.querySelector('.expand-icon');

            if (!childrenContainer || !icon) return;

            // Toggle visibility
            const isExpanded = childrenContainer.style.display === 'none';
            if (isExpanded) {
                // Expand
                childrenContainer.style.display = 'block';
                icon.textContent = '▼';
                dirElement.dataset.collapsed = 'false';
            } else {
                // Collapse
                childrenContainer.style.display = 'none';
                icon.textContent = '▶';
                dirElement.dataset.collapsed = 'true';
            }

            // Save state to localStorage (function defined in navigation.js)
            if (typeof saveTreeState === 'function') {
                saveTreeState();
            }
        }

        // Drag-and-drop file moving (event delegation on sidebar-tree)
        (function() {
            var draggedPath = null;
            var draggedIsDir = false;
            var expandTimer = null;
            var currentDragOver = null;
            var dragSource = null;

            var sidebar = document.getElementById('sidebar-tree');
            if (!sidebar) return;

            function setDragOver(target) {
                if (target === currentDragOver) return;
                if (currentDragOver) currentDragOver.classList.remove('drag-over');
                currentDragOver = target;
                if (currentDragOver) currentDragOver.classList.add('drag-over');
            }

            function cleanupDrag() {
                draggedPath = null;
                draggedIsDir = false;
                clearTimeout(expandTimer);
                setDragOver(null);
                if (dragSource) { dragSource.classList.remove('dragging'); dragSource = null; }
            }

            sidebar.addEventListener('dragstart', function(e) {
                var node = e.target.closest('.tree-node[data-file-path], .tree-node[data-dir-path]');
                if (!node) { e.preventDefault(); return; }
                draggedIsDir = !!node.dataset.dirPath;
                draggedPath = node.dataset.filePath || node.dataset.dirPath;
                dragSource = node.querySelector('.tree-file') || node.querySelector('.tree-directory');
                if (dragSource) dragSource.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', draggedPath);
                e.dataTransfer.setData('application/x-peekm-dir', draggedIsDir ? '1' : '0');
            });

            sidebar.addEventListener('dragend', cleanupDrag);

            sidebar.addEventListener('dragover', function(e) {
                if (!draggedPath) return;
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                var target = findDropTarget(e.target);
                // Prevent dropping a folder onto itself or its children
                if (draggedIsDir && target) {
                    var targetPath = target.querySelector('.tree-directory');
                    if (targetPath) {
                        var tp = targetPath.dataset.path;
                        if (tp === draggedPath || tp.startsWith(draggedPath + '/')) {
                            setDragOver(null);
                            return;
                        }
                    }
                }
                setDragOver(target);
            });

            sidebar.addEventListener('dragenter', function(e) {
                if (!draggedPath) return;
                clearTimeout(expandTimer);
                var dirSpan = e.target.closest('.tree-directory');
                if (!dirSpan) return;
                var children = dirSpan.closest('.tree-item').querySelector('.tree-children');
                if (children && children.style.display === 'none') {
                    expandTimer = setTimeout(function() { toggleDir(dirSpan); }, 700);
                }
            });

            sidebar.addEventListener('drop', function(e) {
                e.preventDefault();
                cleanupDrag();

                var destDir = '';
                var dirSpan = e.target.closest('.tree-directory');
                if (dirSpan) destDir = dirSpan.dataset.path;

                var source = e.dataTransfer.getData('text/plain');
                if (!source) return;
                var isDir = e.dataTransfer.getData('application/x-peekm-dir') === '1';

                // No-op: same parent (files) or same destination (folders)
                if (isDir) {
                    if (source === destDir || destDir.startsWith(source + '/')) return;
                    var dirParent = source.split('/').slice(0, -1).join('/');
                    if (dirParent === destDir) return;
                } else {
                    var parts = source.split('/');
                    var sourceDir = parts.length > 1 ? parts.slice(0, -1).join('/') : '';
                    if (sourceDir === destDir) return;
                }

                moveFile(source, destDir);
            });

            function findDropTarget(el) {
                var dirSpan = el.closest('.tree-directory');
                if (dirSpan) return dirSpan.closest('.tree-node');
                return null;
            }

            function moveFile(source, dest) {
                fetch('/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source: source, dest: dest })
                })
                .then(function(response) {
                    if (response.ok) return response.json();
                    return response.text().then(function(t) { throw new Error(t); });
                })
                .then(function(data) {
                    showToast('Moved: ' + source.split('/').pop(), null, null);
                    // Skip optimistic tree manipulation — scheduleTreeRefresh
                    // fetches the authoritative tree from the server, preserving
                    // empty source folders that would otherwise disappear.
                    scheduleTreeRefresh();
                    // Redirect if moved file is currently viewed
                    var current = decodeURIComponent(window.location.pathname.replace('/view/', ''));
                    if (current === source && typeof navigate === 'function') {
                        navigate('/view/' + data.newPath);
                    }
                })
                .catch(function(error) {
                    showErrorToast('Move failed: ' + error.message);
                });
            }
        })();

        // Smart Folder toggle
        function toggleSmartFolder(header) {
            const folder = header.closest('.smart-folder');
            const children = folder.querySelector('.smart-folder-children');
            const icon = header.querySelector('.expand-icon');
            if (!children || !icon) return;

            const isCollapsed = children.style.display === 'none';
            children.style.display = isCollapsed ? 'block' : 'none';
            icon.textContent = isCollapsed ? '▼' : '▶';
            header.dataset.collapsed = isCollapsed ? 'false' : 'true';

            // Persist state
            if (typeof saveSmartFolderState === 'function') {
                saveSmartFolderState();
            }
        }

        // Session Info Panel Toggle
        function toggleSessionInfo() {
            const button = document.getElementById('sessionInfoButton');
            const panel = document.getElementById('sessionInfoPanel');

            if (!button || !panel) return;

            const isExpanded = button.getAttribute('aria-expanded') === 'true';

            if (isExpanded) {
                // Collapse
                button.setAttribute('aria-expanded', 'false');
                panel.setAttribute('aria-hidden', 'true');
            } else {
                // Expand
                button.setAttribute('aria-expanded', 'true');
                panel.setAttribute('aria-hidden', 'false');

                // Smooth scroll into view after transition
                setTimeout(() => {
                    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 350);
            }
        }

        // Copy to Clipboard with Visual Feedback
        function copyToClipboard(text) {
            if (!navigator.clipboard) {
                console.warn('Clipboard API not available');
                return;
            }
            navigator.clipboard.writeText(text).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        // Format ISO timestamp to relative time
        function formatRelativeTime(isoTimestamp) {
            const now = new Date();
            const timestamp = new Date(isoTimestamp);
            const diffMs = now - timestamp;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 10) {
                return 'just now';
            } else if (diffSec < 60) {
                return `${diffSec} seconds ago`;
            } else if (diffMin === 1) {
                return '1 minute ago';
            } else if (diffMin < 60) {
                return `${diffMin} minutes ago`;
            } else if (diffHour === 1) {
                return '1 hour ago';
            } else if (diffHour < 24) {
                return `${diffHour} hours ago`;
            } else if (diffDay === 1) {
                return '1 day ago';
            } else if (diffDay < 7) {
                return `${diffDay} days ago`;
            } else {
                // For older timestamps, show the date
                return timestamp.toLocaleDateString(undefined, {
                    month: 'short',
                    day: 'numeric',
                    year: timestamp.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
                });
            }
        }

        // Initialize session info timestamps on page load
        function initializeSessionInfo() {
            // Format timestamps
            const timestampElements = document.querySelectorAll('.session-timestamp');
            timestampElements.forEach(element => {
                const isoTime = element.getAttribute('datetime');
                if (isoTime) {
                    element.textContent = formatRelativeTime(isoTime);
                }
            });

            // Handle session persistence via localStorage
            handleSessionPersistence();
        }

        // Handle session persistence - save to/restore from localStorage
        function handleSessionPersistence() {
            const panel = document.getElementById('sessionInfoPanel');
            const content = document.getElementById('content');
            if (!content) return;

            // Get current file path from URL
            const match = window.location.pathname.match(/\/view\/(.+)/);
            if (!match) return; // Not a file view

            const filePath = '/' + decodeURIComponent(match[1]);

            // If server provided session data, save it to localStorage
            if (panel && panel.querySelector('.session-info-content')) {
                const sessionData = extractSessionDataFromDOM(panel);
                if (sessionData && typeof saveSessionMetadata === 'function') {
                    saveSessionMetadata(filePath, sessionData);
                    console.log('[Session] Saved to localStorage:', filePath);
                }
            }
            // If no server data, try to restore from localStorage
            else if (typeof getSessionMetadata === 'function') {
                const storedData = getSessionMetadata(filePath);
                if (storedData) {
                    console.log('[Session] Restoring from localStorage:', filePath);
                    renderSessionPanel(filePath, storedData);
                }
            }
        }

        // Extract session data from existing DOM panel
        function extractSessionDataFromDOM(panel) {
            try {
                const sessionIdEl = panel.querySelector('.session-id-value');
                const operationEl = panel.querySelector('.session-operation-badge');
                const permissionEl = panel.querySelector('.session-permission-badge');
                const timestampEl = panel.querySelector('.session-timestamp');
                const cwdEl = panel.querySelector('.session-info-value code');
                const toolUseIdEl = Array.from(panel.querySelectorAll('.session-info-label'))
                    .find(el => el.textContent.includes('Tool Use ID'))
                    ?.nextElementSibling?.querySelector('code');
                const transcriptEl = Array.from(panel.querySelectorAll('.session-info-label'))
                    .find(el => el.textContent.includes('Transcript Path'))
                    ?.nextElementSibling?.querySelector('code');

                if (!sessionIdEl || !operationEl || !timestampEl) return null;

                return {
                    session_id: sessionIdEl.textContent.trim(),
                    tool_name: operationEl.textContent.trim(),
                    permission_mode: permissionEl ? permissionEl.textContent.trim() : '',
                    timestamp: timestampEl.getAttribute('datetime'),
                    cwd: cwdEl ? cwdEl.textContent.trim() : '',
                    tool_use_id: toolUseIdEl ? toolUseIdEl.textContent.trim() : '',
                    transcript_path: transcriptEl ? transcriptEl.textContent.trim() : ''
                };
            } catch (error) {
                console.error('[Session] Failed to extract session data:', error);
                return null;
            }
        }

        // Render session panel from localStorage data
        // Sanitize a string for safe use in textContent (strips control chars)
        function sanitizeSessionValue(val) {
            return String(val || '').replace(/[\x00-\x1f]/g, '');
        }

        // Safe CSS class suffix: only allow alphanumeric, hyphen, underscore
        function safeCssClass(val) {
            return String(val || '').replace(/[^a-zA-Z0-9_-]/g, '');
        }

        function renderSessionPanel(filePath, sessionData) {
            if (document.getElementById('sessionInfoPanel')) return;

            const content = document.getElementById('content');
            if (!content) return;

            const headerActions = content.querySelector('.file-action-bar');
            if (!headerActions) return;

            // DOM construction helpers (no innerHTML with user data)
            function el(tag, className, children) {
                const node = document.createElement(tag);
                if (className) node.className = className;
                if (Array.isArray(children)) children.forEach(function(c) { node.appendChild(c); });
                else if (typeof children === 'string') node.textContent = children;
                return node;
            }

            function field(label, valueEl) {
                const labelSpan = el('span', 'session-info-label', label);
                return el('div', 'session-info-field', [labelSpan, valueEl]);
            }

            function badgeField(label, badgeClass, modifierPrefix, value) {
                const badge = el('span', badgeClass + ' ' + modifierPrefix + '-' + safeCssClass(value), sanitizeSessionValue(value));
                return field(label, el('span', 'session-info-value', [badge]));
            }

            function codeField(label, value) {
                return field(label, el('code', 'session-info-value', sanitizeSessionValue(value)));
            }

            // Session info button (static HTML, no user data)
            const button = document.createElement('button');
            button.id = 'sessionInfoButton';
            button.className = 'session-info-button';
            button.setAttribute('onclick', 'toggleSessionInfo()');
            button.setAttribute('aria-label', 'Show session information');
            button.setAttribute('aria-expanded', 'false');
            button.innerHTML = '<span style="display:inline-flex;align-items:center;gap:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span class="session-ai-badge">AI</span></span>';

            const editBtn = headerActions.querySelector('button[onclick*="editFile"]');
            if (editBtn) {
                headerActions.insertBefore(button, editBtn);
            } else {
                headerActions.appendChild(button);
            }

            // Session ID field with copy button
            const sanitizedId = sanitizeSessionValue(sessionData.session_id);
            const copyBtn = document.createElement('button');
            copyBtn.className = 'session-copy-button';
            copyBtn.setAttribute('aria-label', 'Copy session ID');
            copyBtn.title = 'Copy session ID';
            copyBtn.addEventListener('click', function() {
                copyToClipboard(sanitizedId);
                copyBtn.classList.add('copied');
                copyBtn.setAttribute('aria-label', 'Copied!');
                setTimeout(function() {
                    copyBtn.classList.remove('copied');
                    copyBtn.setAttribute('aria-label', 'Copy session ID');
                }, 2000);
            });
            copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

            const idGroup = el('div', 'session-info-value-group', [
                el('code', 'session-info-value session-id-value', sanitizedId),
                copyBtn
            ]);

            // Timestamp field
            const timeEl = el('time', 'session-timestamp', formatRelativeTime(sessionData.timestamp));
            timeEl.setAttribute('datetime', sanitizeSessionValue(sessionData.timestamp));

            // Main section
            const mainSection = el('div', 'session-info-main', [
                field('Session ID:', idGroup),
                badgeField('Operation:', 'session-operation-badge', 'session-operation', sessionData.tool_name),
                badgeField('Permission Mode:', 'session-permission-badge', 'session-permission', sessionData.permission_mode),
                field('Timestamp:', el('span', 'session-info-value', [timeEl]))
            ]);

            // Technical details (optional)
            const techEntries = [
                ['Working Directory:', sessionData.cwd],
                ['Tool Use ID:', sessionData.tool_use_id],
                ['Transcript Path:', sessionData.transcript_path]
            ].filter(function(e) { return e[1]; });

            const panelChildren = [mainSection];

            if (techEntries.length > 0) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'session-technical-toggle';
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.addEventListener('click', function() { toggleTechnicalDetails(); });
                toggleBtn.innerHTML = '<span class="session-technical-chevron">&#9654;</span> Technical Details';

                const techContent = el('div', 'session-technical-content');
                techContent.style.display = 'none';
                techEntries.forEach(function(e) { techContent.appendChild(codeField(e[0], e[1])); });

                panelChildren.push(el('div', 'session-technical-details', [toggleBtn, techContent]));
            }

            // Assemble panel
            const panel = el('div', 'session-info-panel', [el('div', 'session-info-content', panelChildren)]);
            panel.id = 'sessionInfoPanel';
            panel.setAttribute('aria-hidden', 'true');
            panel.style.display = 'none';

            // Insert panel after subtitle
            const subtitle = content.querySelector('.subtitle');
            if (subtitle && subtitle.parentNode) {
                subtitle.parentNode.insertBefore(panel, subtitle.nextSibling);
            }

            console.log('[Session] Rendered panel from localStorage');
        }

        // Call initialization when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            initializeSessionInfo();

            // Restore tree state from localStorage (function defined in navigation.js)
            if (typeof restoreTreeState === 'function') {
                restoreTreeState();
            }

            // Update timestamps every minute
            setInterval(() => {
                const timestampElements = document.querySelectorAll('.session-timestamp');
                timestampElements.forEach(element => {
                    const isoTime = element.getAttribute('datetime');
                    if (isoTime) {
                        element.textContent = formatRelativeTime(isoTime);
                    }
                });
            }, 60000); // Update every 60 seconds
        });

        // Note: setupCollapse() and findParentItem() are defined in navigation.js
        // They will be called automatically by the DOMContentLoaded handler in navigation.js

        // Handle toast click to navigate to file (uses SPA navigation)
        // Note: toast functions (showToast, hideToast) are defined in navigation.js
        document.addEventListener('DOMContentLoaded', function() {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.addEventListener('click', function(e) {
                    // Let browser handle Cmd/Ctrl+Click naturally (opens new tab)
                    if (e.metaKey || e.ctrlKey) {
                        return; // Don't prevent default - let <a> tag handle it
                    }

                    // For normal clicks, use SPA navigation if available
                    e.preventDefault(); // Prevent full page navigation
                    const href = this.getAttribute('href');

                    if (href && href !== '#' && typeof navigate === 'function') {
                        navigate(href);
                    }
                });
            }
        });

        {{.EditorJS}}

    </script>
